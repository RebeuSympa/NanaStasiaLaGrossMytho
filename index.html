<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Petit MOTUS pour LA babiiiiiiiiiiies</title>
  <style>
    :root {
      --bg: #121213; --card-bg: #1a1a1b; --border-empty: #3a3a3c;
      --border-active: #565758; --text: #ffffff; --green: #538d4e;
      --yellow: #b59f3b; --gray: #3a3a3c; --key-bg: #818384;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; height: 100dvh; padding: 10px; overflow: hidden; }

    /* Écran d'accueil */
    #welcome-screen { 
      position: absolute; 
      inset: 0; 
      background: var(--bg); 
      z-index: 9999; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 24px; 
      text-align: center; 
    }
    #welcome-screen.hidden { 
      opacity: 0; 
      visibility: hidden; 
      pointer-events: none; 
      transition: 0.4s; 
    }
    .welcome-card { 
      background: var(--card-bg); 
      border: 1px solid var(--border-empty); 
      border-radius: 16px; 
      padding: 30px; 
      max-width: 380px; 
      position: relative;
      z-index: 10000;
    }
    .rules-list { text-align: left; margin: 24px 0; display: flex; flex-direction: column; gap: 12px; font-size: 0.9rem; }
    .rule-badge { padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
    .rules-italic { font-style: italic; color: #aaa; margin-top: 10px; font-size: 0.85rem; }
    #start-btn { background-color: var(--green); color: white; border: none; padding: 12px 24px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; }

    /* Jeu */
    header { text-align: center; padding-bottom: 8px; border-bottom: 1px solid var(--border-empty); width: 100%; max-width: 480px; }
    #board-container { display: flex; justify-content: center; align-items: center; flex-grow: 1; width: 100%; }
    #board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; width: 100%; max-width: 380px; }
    .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .tile { aspect-ratio: 1; border: 2px solid var(--border-empty); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: bold; text-transform: uppercase; transition: transform 0.25s; }
    .tile.active { border-color: var(--border-active); animation: pop 0.1s ease-in-out; }
    
    /* Clavier */
    #keyboard { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 6px; }
    .keyboard-row { display: flex; justify-content: center; gap: 4px; touch-action: manipulation; }
    .key { background-color: var(--key-bg); color: var(--text); border: none; border-radius: 4px; height: 48px; flex: 1; cursor: pointer; text-transform: uppercase; font-weight: bold; font-size: 0.85rem; }
    .key.large { flex: 1.5; font-size: 0.75rem; }

    /* Modal */
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 15px; z-index: 30; }
    #modal-content { background: var(--card-bg); border: 1px solid var(--border-empty); border-radius: 12px; padding: 20px; text-align: center; max-width: 380px; width: 100%; max-height: 90vh; overflow-y: auto; }
    #modal-content img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
    #modal-content h2 { font-size: 1.3rem; margin-bottom: 8px; }
    #modal-msg { font-size: 0.85rem; margin-bottom: 15px; text-align: left; white-space: pre-line; color: #d7dadc; line-height: 1.35; }
    #modal-action-btn { display: block; background-color: var(--green); color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.95rem; }

    .correct { background-color: var(--green) !important; border-color: var(--green) !important; }
    .present { background-color: var(--yellow) !important; border-color: var(--yellow) !important; }
    .absent { background-color: var(--gray) !important; border-color: var(--gray) !important; }
    @keyframes pop { 50% { transform: scale(1.1); } }
    .flip { animation: flip-tile 0.5s ease forwards; }
    @keyframes flip-tile { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
  </style>
</head>
<body>

  <div id="welcome-screen">
    <div class="welcome-card">
      <h1>MOTUS 🐺</h1>
      <div class="rules-list">
        <div class="rule-item"><span class="rule-badge" style="background:var(--green)">Vert</span> La lettre est bien placée.</div>
        <div class="rule-item"><span class="rule-badge" style="background:var(--yellow)">Jaune</span> La lettre est dans le mot mais mal placée.</div>
        <div class="rule-item">🎯 Trouve le mot secret en 6 essais !</div>
        <div class="rules-italic">Vu que vrai DZ sous fierté est incapable de faire passer un message normalement je t'ai fait un motus ( je t'attends à MTP ?)</div>
      </div>
      <button id="start-btn" onclick="startGame()">C'EST PARTI !</button>
    </div>
  </div>

  <header><h1>MOTUS BABIIES</h1></header>

  <div id="board-container"><div id="board"></div></div>

  <div id="keyboard">
    <div class="keyboard-row">
      <button class="key" data-key="A">A</button><button class="key" data-key="Z">Z</button><button class="key" data-key="E">E</button><button class="key" data-key="R">R</button><button class="key" data-key="T">T</button><button class="key" data-key="Y">Y</button><button class="key" data-key="U">U</button><button class="key" data-key="I">I</button><button class="key" data-key="O">O</button><button class="key" data-key="P">P</button>
    </div>
    <div class="keyboard-row">
      <button class="key" data-key="Q">Q</button><button class="key" data-key="S">S</button><button class="key" data-key="D">D</button><button class="key" data-key="F">F</button><button class="key" data-key="G">G</button><button class="key" data-key="H">H</button><button class="key" data-key="J">J</button><button class="key" data-key="K">K</button><button class="key" data-key="L">L</button><button class="key" data-key="M">M</button>
    </div>
    <div class="keyboard-row">
      <button class="key large" data-key="ENTER">OK</button><button class="key" data-key="W">W</button><button class="key" data-key="X">X</button><button class="key" data-key="C">C</button><button class="key" data-key="V">V</button><button class="key" data-key="B">B</button><button class="key" data-key="N">N</button><button class="key large" data-key="BACKSPACE">⌫</button>
    </div>
  </div>

  <div id="modal">
    <div id="modal-content">
      <h2>Bravo ! 🎉</h2>
      <img src="ton-nom-de-photo.jpg" alt="Photo">
      <p id="modal-msg"></p>
      <a id="modal-action-btn" href="https://snapchat.com/t/YUQxevl4" target="_blank">Je t'attends ici ?</a>
    </div>
  </div>

  <script>
    const TARGET_WORD = "DATEMOI";
    let currentRow = 0, currentTile = 0, currentGuess = "", isGameOver = false;

    const board = document.getElementById("board");
    for (let r = 0; r < 6; r++) {
      const row = document.createElement("div"); row.className = "row"; row.id = `row-${r}`;
      for (let c = 0; c < 7; c++) {
        const tile = document.createElement("div"); tile.className = "tile"; tile.id = `tile-${r}-${c}`;
        row.appendChild(tile);
      }
      board.appendChild(row);
    }

    function startGame() {
      document.getElementById("welcome-screen").classList.add("hidden");
    }

    function handleKey(key) {
      if (isGameOver) return;
      
      if (key === "ENTER") {
        if (currentGuess.length === 7) {
          const rowTiles = document.getElementById(`row-${currentRow}`).children;
          let targetArr = TARGET_WORD.split("");
          let status = Array(7).fill("absent");

          for (let i = 0; i < 7; i++) {
            if (currentGuess[i] === targetArr[i]) { 
              status[i] = "correct"; 
              targetArr[i] = null; 
            }
          }

          for (let i = 0; i < 7; i++) {
            if (status[i] !== "correct" && targetArr.includes(currentGuess[i])) { 
              status[i] = "present"; 
              targetArr[targetArr.indexOf(currentGuess[i])] = null; 
            }
          }
          
          for (let i = 0; i < 7; i++) {
            setTimeout(() => {
              rowTiles[i].classList.add("flip", status[i]);
              if (i === 6) {
                if (currentGuess === TARGET_WORD) {
                  isGameOver = true;
                  document.getElementById("modal-msg").innerText = `J'avoue que malgré tout j'ai passé un bête de moment avec toi et c'était bien drôle même si tu fais tarpin l'ancienne à dire à tout le monde "JJJJJJJAAAAAAAAAAAAAMMMMMMMMMMAIS DE LA VIE" ksos va\nça sera marrant si je te revois`;
                  document.getElementById("modal").style.display = "flex";
                } else if (currentRow < 5) { 
                  currentRow++; 
                  currentTile = 0; 
                  currentGuess = ""; 
                } else { 
                  alert("Perdu ! C'était pas ça tdc"); 
                  isGameOver = true; 
                }
              }
            }, i * 200);
          }
        }
      } else if (key === "BACKSPACE") {
        if (currentTile > 0) { 
          currentTile--; 
          currentGuess = currentGuess.slice(0, -1); 
          document.getElementById(`tile-${currentRow}-${currentTile}`).textContent = ""; 
        }
      } else if (currentGuess.length < 7) {
        const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
        tile.textContent = key;
        tile.classList.add("active");
        currentGuess += key;
        currentTile++;
      }
    }

    window.addEventListener("keydown", (e) => {
      if (!e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey) {
        const key = e.key.toUpperCase();
        if (key === "ENTER" || key === "BACKSPACE" || /^[A-Z]$/.test(key)) handleKey(key);
      }
    });

    document.getElementById("keyboard").addEventListener("click", (e) => {
      if (e.target.matches(".key")) handleKey(e.target.getAttribute("data-key"));
    });
  </script>
</body>
</html>
